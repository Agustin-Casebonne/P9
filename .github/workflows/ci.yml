name: CI Pipeline

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  archetype:
    runs-on: ubuntu-22.04
    outputs:
      group: ${{ steps.coordinates.outputs.group }}
      artifact: ${{ steps.coordinates.outputs.artifact }}
      version: ${{ steps.coordinates.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Verificar pom.xml
        run: |
          if [ -f pom.xml ]; then
            echo "pom.xml found"
          else
            echo "Error: pom.xml not found."
            exit 1
          fi

      - name: Extraer coordenadas Maven
        id: coordinates
        run: |
          GROUP=$(mvn help:evaluate -Dexpression=project.groupId -q -DforceStdout)
          ARTIFACT=$(mvn help:evaluate -Dexpression=project.artifactId -q -DforceStdout)
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "group=${GROUP}" >> $GITHUB_OUTPUT
          echo "artifact=${ARTIFACT}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

  build:
    runs-on: ubuntu-22.04
    needs: archetype
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Restaurar caché de dependencias
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: maven-dependencies-${{ needs.archetype.outputs.artifact }}-${{ needs.archetype.outputs.version }}

      - name: Construir y empaquetar
        run: mvn -B clean compile test package verify -Djacoco.haltOnFailure=false

      - name: Guardar JAR
        uses: actions/upload-artifact@v4
        with:
          name: jar
          path: target/${{ needs.archetype.outputs.artifact }}-${{ needs.archetype.outputs.version }}.jar

      - name: Guardar reporte de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

  coverage-check:
    runs-on: ubuntu-22.04
    needs: build
    steps:
      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Descargar reporte de cobertura
        uses: actions/download-artifact@v4
        with:
          name: jacoco-report
          path: ./reports

      - name: Verificar umbral de cobertura
        run: |
          THRESHOLD=80
          # jacoco.xml no tiene <line-rate> (eso es formato Cobertura); se usa el
          # contador LINE global del informe, que es el ultimo del documento.
          LINE=$(grep -o '<counter type="LINE"[^>]*/>' ./reports/jacoco.xml | tail -1)
          echo "Contador JaCoCo: $LINE"
          MISSED=$(echo "$LINE" | grep -Po 'missed="\K[0-9]+')
          COVERED=$(echo "$LINE" | grep -Po 'covered="\K[0-9]+')
          if [ -z "$MISSED" ] || [ -z "$COVERED" ]; then
            echo "Error: no se ha podido leer la cobertura de jacoco.xml"
            exit 1
          fi
          COVERAGE=$(echo "scale=2; 100 * $COVERED / ($MISSED + $COVERED)" | bc -l)
          if (( $(echo "$COVERAGE < $THRESHOLD" | bc -l) )); then
            echo "Coverage below threshold: $COVERAGE%"
            exit 1
          fi
          echo "Coverage meets the threshold: $COVERAGE%"
