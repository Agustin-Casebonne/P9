name: Contextos de GitHub Actions

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/contexts.yml'
      - '.github/workflows/reusable-saludo.yml'
  workflow_dispatch:
    inputs:
      entorno:
        description: "Entorno de despliegue"
        required: true
        type: choice
        options: [desarrollo, produccion]
        default: desarrollo
      nivel_log:
        description: "Nivel de detalle del log"
        required: true
        type: choice
        options: [info, debug]
        default: info
      ejecutar_matriz:
        description: "Ejecutar el job con matriz de sistemas operativos"
        type: boolean
        default: true
      usuario:
        description: "Nombre que se envía al flujo reutilizable"
        type: string
        default: Invitado
      demo_secreto:
        description: "Demostrar el enmascarado de secretos (usa un secreto ficticio)"
        type: boolean
        default: false

env:
  APP_NAME: contextos-demo

jobs:
  diagnostico:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnóstico seguro (solo campos no sensibles)
        env:
          REPO: ${{ github.repository }}
          EVENTO: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          FLUJO: ${{ github.workflow }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          ACTOR: ${{ github.actor }}
          SO: ${{ runner.os }}
          ARQ: ${{ runner.arch }}
          TEMP_DIR: ${{ runner.temp }}
          TOOL_CACHE: ${{ runner.tool_cache }}
          API: ${{ vars.API_ENDPOINT }}
        run: |
          echo "== github =="
          echo "Repositorio:  $REPO"
          echo "Evento:       $EVENTO"
          echo "Referencia:   $REF"
          echo "Commit:       ${SHA::7}"
          echo "Workflow:     $FLUJO"
          echo "Ejecución:    id=$RUN_ID número=$RUN_NUMBER"
          echo "Actor:        $ACTOR"
          echo "== runner =="
          echo "SO=$SO  Arquitectura=$ARQ"
          echo "Temporal:     $TEMP_DIR"
          echo "Tool cache:   $TOOL_CACHE"
          echo "== env / vars / job =="
          echo "APP_NAME:     $APP_NAME"
          echo "API_ENDPOINT: ${API:-(no definida)}"
          echo "job.status:   ${{ job.status }}"

      - name: Comprobar el secreto sin mostrarlo
        env:
          TOKEN: ${{ secrets.DEMO_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "DEMO_TOKEN: configurado (valor no mostrado)"
          else
            echo "DEMO_TOKEN: no configurado"
          fi

      - name: Claves del evento (sin valores)
        run: jq -r 'keys | join(", ")' "$GITHUB_EVENT_PATH"

      - name: Demostración de enmascarado (secreto ficticio)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.demo_secreto }}
        env:
          TOKEN: ${{ secrets.DEMO_TOKEN }}
        run: |
          echo "Valor directo:   $TOKEN"
          echo "Valor invertido: $(echo "$TOKEN" | rev)"

  pasos:
    runs-on: ubuntu-latest
    steps:
      - id: genera
        name: Generar un output con GITHUB_OUTPUT
        run: echo "dato=Hola, mundo" >> "$GITHUB_OUTPUT"

      - id: legado
        name: Generar un segundo output (antes set-output)
        run: echo "dato=Hola desde el segundo paso" >> "$GITHUB_OUTPUT"

      - name: Leer los outputs anteriores
        run: |
          echo "genera.outputs.dato = ${{ steps.genera.outputs.dato }}"
          echo "legado.outputs.dato = ${{ steps.legado.outputs.dato }}"

      - id: falla
        name: Paso que falla con continue-on-error
        run: exit 1
        continue-on-error: true

      - name: Si conclusion == failure
        if: ${{ steps.falla.conclusion == 'failure' }}
        run: echo "El paso anterior falló (conclusion)."

      - name: Si outcome == failure
        if: ${{ steps.falla.outcome == 'failure' }}
        run: echo "El paso anterior falló (outcome)."

      - name: Mostrar conclusion y outcome
        run: echo "conclusion=${{ steps.falla.conclusion }} outcome=${{ steps.falla.outcome }}"

  preparar:
    runs-on: ubuntu-latest
    outputs:
      entorno: ${{ steps.config.outputs.entorno }}
      replicas: ${{ steps.config.outputs.replicas }}
      debug: ${{ steps.config.outputs.debug }}
    steps:
      - id: config
        name: Calcular la configuración a partir de los inputs
        env:
          ENTORNO: ${{ inputs.entorno || 'desarrollo' }}
          NIVEL: ${{ inputs.nivel_log || 'info' }}
        run: |
          if [ "$ENTORNO" = "produccion" ]; then REPLICAS=3; else REPLICAS=1; fi
          echo "entorno=$ENTORNO" >> "$GITHUB_OUTPUT"
          echo "replicas=$REPLICAS" >> "$GITHUB_OUTPUT"
          echo "debug=$([ "$NIVEL" = "debug" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
          echo "Configuración: entorno=$ENTORNO réplicas=$REPLICAS nivel=$NIVEL"

  desplegar:
    runs-on: ubuntu-latest
    needs: preparar
    steps:
      - name: Despliegue simulado
        env:
          ENTORNO: ${{ needs.preparar.outputs.entorno }}
          REPLICAS: ${{ needs.preparar.outputs.replicas }}
        run: echo "Desplegando $APP_NAME en $ENTORNO con $REPLICAS réplica(s)"

      - name: Verificación previa (solo producción)
        if: ${{ needs.preparar.outputs.entorno == 'produccion' }}
        run: echo "Producción - se comprueba la versión y se exige aprobación antes de continuar"

      - name: Detalle de depuración (solo nivel debug)
        if: ${{ needs.preparar.outputs.debug == 'true' }}
        run: |
          echo "job.status=${{ job.status }}"
          echo "runner.name=${{ runner.name }}"
          echo "needs.preparar.result=${{ needs.preparar.result }}"

      - name: Resumen final
        if: ${{ always() }}
        run: echo "Estado del job desplegar = ${{ job.status }}"

  matriz:
    needs: preparar
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.ejecutar_matriz }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Mostrar la estrategia y la matriz
        shell: bash
        run: |
          echo "matrix.os=${{ matrix.os }}  runner.os=${{ runner.os }}"
          echo "strategy.job-index=${{ strategy.job-index }} de ${{ strategy.job-total }}"
          echo "strategy.fail-fast=${{ strategy.fail-fast }}  max-parallel=${{ strategy.max-parallel }}"

      - name: Solo en Linux
        if: ${{ runner.os == 'Linux' }}
        run: echo "Kernel $(uname -r)"

      - name: Solo en Windows
        if: ${{ runner.os == 'Windows' }}
        shell: pwsh
        run: Write-Output "PowerShell $($PSVersionTable.PSVersion)"

  use-reusable:
    uses: ./.github/workflows/reusable-saludo.yml
    with:
      input_value: ${{ inputs.usuario || 'push automático' }}

  show-output:
    runs-on: ubuntu-latest
    needs: use-reusable
    steps:
      - name: Mostrar salida del flujo reutilizable
        run: |
          echo "Resultado: ${{ needs.use-reusable.outputs.result }}"
